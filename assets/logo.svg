<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">causalmlp logo</title>
  <desc id="desc">Four ascending bars joined by a cumulative curve, representing a prediction at every hidden width.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111b35"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="bars" x1="24" y1="104" x2="102" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset=".55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="curve" x1="30" y1="82" x2="96" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="126" height="126" rx="28" fill="url(#bg)" stroke="#243149" stroke-width="2"/>
  <g opacity=".38" stroke="#334155" stroke-width="1">
    <path d="M26 104V24M48 104V24M70 104V24M92 104V24M20 82H108M20 60H108M20 38H108"/>
  </g>
  <g fill="url(#bars)">
    <rect x="24" y="78" width="12" height="26" rx="4"/>
    <rect x="46" y="64" width="12" height="40" rx="4"/>
    <rect x="68" y="48" width="12" height="56" rx="4"/>
    <rect x="90" y="30" width="12" height="74" rx="4"/>
  </g>
  <path d="M30 82 52 67 74 50 96 31" fill="none" stroke="url(#curve)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <g fill="#ecfeff" stroke="#0f172a" stroke-width="1.5">
    <circle cx="30" cy="82" r="4"/>
    <circle cx="52" cy="67" r="4"/>
    <circle cx="74" cy="50" r="4"/>
    <circle cx="96" cy="31" r="4"/>
  </g>
</svg>
